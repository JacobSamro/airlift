# Tap "Check for update" (checkForUpdateAsync → fetchUpdateAsync →
# reloadAsync) and assert the app reloaded into the expected bundle.
# env: MARKER, ORIGIN, EXTRA (none|loaded; run.sh defaults it to none)
appId: dev.airlift.e2e
---
- launchApp:
    stopApp: false
# Don't tap before the JS tree is up and idle.
- extendedWaitUntil:
    visible:
      id: status
      text: "status:idle"
    timeout: 60000
- tapOn:
    id: check
- extendedWaitUntil:
    visible:
      id: marker
      text: "marker:${MARKER}"
    timeout: 120000
- assertVisible:
    id: origin
    text: "origin:${ORIGIN}"
- extendedWaitUntil:
    visible:
      id: extra
      text: "extra:${EXTRA}"
    timeout: 30000
