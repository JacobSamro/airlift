# Tap "Check for update" (checkForUpdateAsync → fetchUpdateAsync →
# reloadAsync) and assert the app reloaded into the expected bundle.
# env: MARKER, ORIGIN, EXTRA (none|loaded; run.sh defaults it to none)
appId: dev.airlift.e2e
---
- launchApp:
    stopApp: false
# Don't tap before the JS tree is up and not busy (the app keeps running
# between steps, so a previous check's result may still be showing).
- extendedWaitUntil:
    visible:
      id: status
      text: "status:(idle|up-to-date.*)"
    timeout: 60000
- runFlow: tap-check.yaml
# Still idle on the old bundle ⇒ the tap never reached the app: tap again.
- repeat:
    times: 3
    while:
      visible:
        id: status
        text: "status:idle"
      notVisible:
        id: marker
        text: "marker:${MARKER}"
    commands:
      - runFlow: tap-check.yaml
- extendedWaitUntil:
    visible:
      id: marker
      text: "marker:${MARKER}"
    timeout: 120000
- assertVisible:
    id: origin
    text: "origin:${ORIGIN}"
- extendedWaitUntil:
    visible:
      id: extra
      text: "extra:${EXTRA}"
    timeout: 30000
