# Tap "Check for update" (checkForUpdateAsync → fetchUpdateAsync →
# reloadAsync) and assert the app reloaded into the expected bundle.
# env: MARKER, ORIGIN, EXTRA (none|loaded; run.sh defaults it to none)
appId: dev.airlift.e2e
---
- launchApp:
    stopApp: false
# Don't tap before the JS tree is up and not busy (the app keeps running
# between steps, so a previous check's result may still be showing).
- extendedWaitUntil:
    visible:
      id: status
      text: "status:(idle|up-to-date.*)"
    timeout: 60000
# On a busy iOS simulator a tap can be "COMPLETED" yet never reach the app.
# A delivered tap always changes the screen (status → checking), so retry
# until it does.
- tapOn:
    id: check
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: marker
      text: "marker:${MARKER}"
    timeout: 120000
- assertVisible:
    id: origin
    text: "origin:${ORIGIN}"
- extendedWaitUntil:
    visible:
      id: extra
      text: "extra:${EXTRA}"
    timeout: 30000
