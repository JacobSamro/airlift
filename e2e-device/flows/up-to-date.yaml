# Tap "Check for update" and assert the server reported nothing new, and
# the app stayed on the expected bundle.
# env: MARKER
appId: dev.airlift.e2e
---
- launchApp:
    stopApp: false
# Strictly idle (fresh after a reload): a stale "up-to-date" from an earlier
# check would otherwise satisfy the assertion below without a new check.
- extendedWaitUntil:
    visible:
      id: status
      text: "status:idle"
    timeout: 60000
- runFlow: tap-check.yaml
# A check never ends in "idle", so still idle ⇒ the tap was dropped.
- repeat:
    times: 3
    while:
      visible:
        id: status
        text: "status:idle"
    commands:
      - runFlow: tap-check.yaml
- extendedWaitUntil:
    visible:
      id: status
      text: "status:up-to-date.*"
    timeout: 60000
- assertVisible:
    id: marker
    text: "marker:${MARKER}"
