[package]
name = "airlift"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A self-hosted Expo OTA update server: S3-backed (Tigris), single binary, built-in dashboard."
license = "MIT"
repository = "https://github.com/jacobsamro/airlift"
readme = "README.md"
default-run = "airlift"

# cargo-release is the single source of truth for versioning: `cargo release
# <version|level> --execute` bumps this version, commits, tags `v<version>`
# (matching the release workflow's `v*` trigger), and pushes — so the manifest
# version and the git tag can never drift.
[package.metadata.release]
publish = false                     # airlift is a binary app, not a crates.io lib
tag-name = "v{{version}}"
tag-message = "airlift {{version}}"
pre-release-commit-message = "release: {{version}}"
allow-branch = ["master", "main"]

[[bin]]
name = "airlift"
path = "src/main.rs"

[dependencies]
# Async runtime + web
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "http2", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors", "set-header", "limit"] }
hyper = { version = "1", features = ["full"] }
bytes = "1"
http = "1"
futures = "0.3"
dashmap = "6"

# Storage (Tigris = S3 compatible)
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-smithy-types = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "time", "uuid"] }

# Auth + crypto
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Expo Updates code signing: per-app RSA-2048 keypair; manifests are signed
# RSA-SHA256 (pkcs1v15) and the self-signed X.509 cert is embedded in the app.
rsa = { version = "0.9", features = ["sha2", "pem"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }

# Reading uploaded `expo export` archives
zip = { version = "2", default-features = false, features = ["deflate"] }

# Incremental launch-bundle patches (SDK 55+). qbsdiff emits the classic
# bzip2 BSDIFF40 container — the only format the expo-updates vendored
# bspatch.c accepts (Endsley BSDIFF43 does NOT apply).
qbsdiff = "1"

# Serialization + config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# CLI + observability
clap = { version = "4", features = ["derive", "env"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Embedded web UI
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Automatic TLS (Let's Encrypt / ACME)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.13", default-features = false, features = ["ring", "tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tokio-util = { version = "0.7", features = ["compat"] }

# Rate limiting
governor = "0.8"

# Lock-free hot-swap of the storage client when settings change at runtime
arc-swap = "1"

# Google OAuth (token exchange + userinfo over HTTPS)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Utilities
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Pinned: time 0.3.52 changed the Parsable signature and breaks cookie 0.18.
time = { version = "=0.3.51", features = ["serde", "formatting", "parsing"] }
url = "2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# End-to-end tests boot the real binary against an in-process S3 stub (axum)
# and drive it over HTTP — no Docker or external network required.
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tempfile = "3"
# The e2e acts as an expo-updates client: builds export zips, parses the
# app certificate, and verifies manifest signatures.
zip = { version = "2", default-features = false, features = ["deflate"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
x509-parser = "0.16"
qbsdiff = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
